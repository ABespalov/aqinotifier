# ==============================================================================
#  Dashboard Configuration: e-Ink 7.5" (800x480)
#  Used to describe the visual layout of the screen.
# ==============================================================================

# Global screen settings
screen:
  width: 800                # Screen width in pixels
  height: 480               # Screen height in pixels
  anti_aliasing: false      # Enable/disable anti-aliasing (false is recommended for e-Ink screens for sharpness)
  palette:                  # Global color palette used in the layout
    white: "#FFFFFF"
    black: "#000000"
    yellow: "#FFD500"
    red: "#FF0000"

error:
  margin:
    x: 10
    y: 10
  size: 7

# Localization language for labels retrieved from i18n dictionaries
lang: "ru"

# Default settings for layout elements
defaults:
  fit_text: true            # Automatic font size fitting to container bounds
  align:                    # Default text alignment
    h: "center"             # Horizontal: center, left, right
    v: "center"             # Vertical: center, top, bottom

# Output format for the final generated image
output:
  format: "epd_pr"         # Output format (binary raw buffers format for EPD displays)
  background: "white"       # Background color used to fill the screen before rendering
  mapping:                  # Mapping of logical palette colors to buffer bits [Buffer 1, Buffer 2]
    black:  [0, 0]          # Black color: 0 in first buffer, 0 in second
    white:  [1, 0]          # White color: 1 in first buffer, 0 in second
    yellow: [0, 1]          # Yellow/Red: depending on the specification of the EPD display
    red:    [1, 1]          # Combination of bits for red color

# Access Control List (ACL) - allowed IP addresses or CIDR subnets to request this dashboard
allowed:
  - "192.168.101.0/24"
  - "127.0.0.1"

# Unit overrides for various sensor types
units:
  temperature: "c"          # Temperature unit (celsius)
  pressure: "mmhg"          # Pressure unit (mmHg)

# Font definitions: aliases mapped to TTF files and sizes
fonts:
  aqi: { file: "fonts/PT-Root-UI_Bold.ttf", size: 100 }                       # Font for the main AQI index
  values: { file: "fonts/PT-Root-UI_Bold.ttf", size: 30 }                     # Font for sensor values
  header: { file: "fonts/PT-Root-UI_Bold.ttf", size: 28 }                     # Font for headers
  zone: { file: "fonts/PT-Root-UI_Medium.ttf", size: 24, hinting: "none" }    # Font for the AQI zone name
  labels: { file: "fonts/PT-Root-UI_Medium.ttf", size: 20, hinting: "none" }  # Font for sensor labels
  units: { file: "fonts/PT-Root-UI_Medium.ttf", size: 15 }                    # Font for units
  axis_x: { file: "fonts/PT-Root-UI_Medium.ttf", size: 14 }                   # Font for chart X-axis labels
  axis_y: { file: "fonts/PT-Root-UI_Medium.ttf", size: 16 }                   # Font for chart Y-axis labels
  datetime: { file: "fonts/PT-Root-UI_Regular.ttf", size: 18 }                # Font for date and time

# ==============================================================================
#  LAYOUT DEFINITIONS
# ==============================================================================
# The layout array contains elements rendered sequentially (text, cards, charts, lines).
layout:

  # ----------------------------------------------------------------------------
  # LEFT COLUMN: Main Air Quality parameters (AQI, PM2.5, PM10) and Date/Time
  # ----------------------------------------------------------------------------
  
  # AQI block header (static text)
  - type: "text"
    position:
      x: 10                 # X coordinate of the top-left corner
      y: 15                 # Y coordinate of the top-left corner
    size:
      w: 175                # Container width in pixels
      h: 30                 # Container height in pixels
    font:
      face: "header"        # Font alias from fonts section
      fg: "black"           # Text color
    template: "AQI USA"     # Display template

  # Main AQI value card (large rectangle with dynamic background)
  - type: "value"
    source: "aqi.us.value"     # Telemetry data source
    radius: 15              # Corner rounding radius for borders
    position:
      x: 10
      y: 70
    size:
      w: 175
      h: 160
    value:                  # Settings for the numeric value display
      font:
        face: "aqi"
        fg: "black"
      margin:
        t: 10               # Top margin
        b: 30               # Bottom margin
    border:                 # Card border and background settings
      t: 5               # Border line thickness
      color: "black"           # Default border color
      bg: "white"           # Default background color
      thresholds:           # Dynamic border and background changes based on thresholds
        - { condition: "aqi.us.zone.index == 2", color: "yellow" } # Moderate level (yellow bg)
        - { condition: "aqi.us.zone.index >= 3", color: "red" }       # Unhealthy level and above (red bg)

  # AQI zone name (e.g. "Good", "Moderate", "Unhealthy")
  - type: "value"
    source: "aqi.us.zone.name" # String representation of the AQI zone
    position:
      x: 10
      y: 180
    size:
      w: 175
      h: 30
    value:
      font:
        face: "zone"
        fg: "black"

  # Shape for PM2.5
  - type: "shape"
    kind: "rect"
    position:
      x: 35
      y: 265
    size:
      w: 125
      h: 44
    corner_radius: 8
    border:
      t: 3
      color: "transparent"
      thresholds:
        - { condition: "pm25.us.zone.index == 2", fg: "yellow" }
        - { condition: "pm25.us.zone.index >= 3", fg: "red" }

  # PM2.5 value card
  - type: "value"
    source: "pm25.value"
    format: "%.0f"          # Format string for float value
    position:
      x: 10
      y: 250
    size:
      w: 175
      h: 55
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"         # Align value to bottom edge
    label:                  # Text label settings for the sensor
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"            # Place sensor name at the top
    unit:                   # Units display settings
      font:
        face: "units"
        fg: "black"
      align:
        p: "right"          # Position units to the right of value (right, left, bottom, none)
        s: 3                # Spacing in pixels between value and unit
        v: "1/2"            # Vertical alignment offset (1/2 means middle of value height)

  # Shape for PM10
  - type: "shape"
    kind: "rect"
    position:
      x: 35
      y: 355
    size:
      w: 125
      h: 44
    corner_radius: 8
    border:
      t: 3
      color: "transparent"
      thresholds:
        - { condition: "pm10.us.zone.index == 2", fg: "yellow" }
        - { condition: "pm10.us.zone.index >= 3", fg: "red" }

  # PM10 value card
  - type: "value"
    source: "pm10.value"
    format: "%.0f"
    position:
      x: 10
      y: 340
    size:
      w: 175
      h: 55
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"
    label:
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"
    unit:
      font:
        face: "units"
        fg: "black"
      align:
        p: "right"
        s: 3
        v: "1/2"

  # Current date and time display block
  - type: "text"
    position:
      x: 10
      y: 430
    size:
      w: 175
      h: 40
    font:
      face: "datetime"
      fg: "black"
    template: "{date:02.01.2006} {time:15:04}" # Time format template (Go-style)

  # Vertical separator line between columns
  - type: "line"
    position:
      x: 195
      y: 20
    l: 440
    t: 1
    angle: 90.0
    color: "black"

  # ----------------------------------------------------------------------------
  # RIGHT COLUMN: Chart showing AQI history
  # ----------------------------------------------------------------------------
  
  # Historical bar chart
  - type: "chart"
    position:
      x: 240
      y: 10
    size:
      w: 540
      h: 330
    source: "aqi.us.value" # History data source
    style: "bar"            # Chart style: bar (columns) or line
    duration: "24h"         # History depth (e.g. 24 hours)
    points: 48              # Number of points on chart (48 points for 24h = 1 point per 30 min)
    axis:                   # Coordinate axes definitions
      y: 
        scale:
          auto: true
          min: 0
          max: auto
        t: 2                # Y axis line thickness
        fg: "black"         # Axis color
        min_step: 50        # Minimum step of grid lines
        show: false         # Show Y-axis line (false - hide line, keep labels/notches)
        labels:             # Y-axis labels configuration
          show: true
          count: 7          # Number of labels along Y axis
          format: "%.0f"     # Format string for labels
          font:
            face: "axis_y"
            fg: "black"
          thresholds:       # Highlight Y-axis labels depending on danger zones
            - { condition: "aqi.us.zone.index == 2", fg: "black", bg: "yellow" }
            - { condition: "aqi.us.zone.index >= 3", fg: "white", bg: "red" }
        notches:            # Notches along Y axis
          show: true
          fg: "black"
          l: 8              # Notch length
          t: 2              # Notch thickness
      x: 
        t: 2                # X axis thickness
        fg: "black"
        show: true
        labels:             # Time labels along X axis
          show: true
          count: 7          # Number of labels
          format: "15:04"   # Time format
          font:
            face: "axis_x"
            fg: "black"
        notches:
          show: true
          fg: "black"
          l: 8
          t: 2
    threshold_lines:        # Horizontal dashed threshold lines on chart
      # style: "dashed.<dash_width>.<gap_width>"
      - { condition: "aqi.us.zone.index == 2", color: "yellow", t: 2, style: "dashed.2.14" }
      - { condition: "aqi.us.zone.index >= 3", color: "red", t: 2, style: "dashed.2.14" }
    thresholds:             # Dynamic bar color based on values
      - { condition: "aqi.us.zone.index == 2", bg: "yellow" }
      - { condition: "aqi.us.zone.index >= 3", bg: "red" }

  # Horizontal separator line above bottom row
  - type: "line"
    position:
      x: 205
      y: 375
    l: 584
    t: 1
    color: "black"

  # ----------------------------------------------------------------------------
  # BOTTOM ROW (Right Column): Environmental parameters (Temp, Hum, Press, Dew Point)
  # ----------------------------------------------------------------------------
  
  # Shape for Temp
  - type: "shape"
    kind: "rect"
    position:
      x: 225
      y: 413
    size:
      w: 106
      h: 55
    corner_radius: 8
    border:
      t: 3
      color: "transparent"
      thresholds:
        - { condition: "temp.value.to_celsius >= 30", fg: "red" }

  # Temperature sensor
  - type: "value"
    source: "temp.value.to_celsius"
    format: "%+.1f"         # Display temp with +/- prefix and 1 decimal place
    position:
      x: 205
      y: 391
    size:
      w: 146
      h: 50
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"
    label:
      template: "Температура" # Localized card header
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"
    unit:
      parameter: "celsius"   # Maps to unit string (e.g. °C)
      font:
        face: "units"
        fg: "black"
      align:
        p: "bottom"         # Place unit underneath the value
        s: 8                # Spacing in pixels

  # Vertical micro-separator between Temperature and Humidity
  - type: "line"
    position:
      x: 351
      y: 390
    l: 75
    t: 1
    angle: 90.0
    color: "black"

  # Shape for Hum
  - type: "shape"
    kind: "rect"
    position:
      x: 371
      y: 413
    size:
      w: 106
      h: 55
    corner_radius: 8
    border:
      t: 3
      color: "transparent"
      thresholds:
        - { condition: "humidity.value <= 30", fg: "red" }

  # Humidity sensor
  - type: "value"
    source: "humidity.value"
    format: "%.1f"
    position:
      x: 351
      y: 391
    size:
      w: 146
      h: 50
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"
    label:
      template: "Влажность"
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"
    unit:
      parameter: "percent"   # Maps to %
      font:
        face: "units"
        fg: "black"
      align:
        p: "bottom"
        s: 8

  # Vertical micro-separator between Humidity and Pressure
  - type: "line"
    position:
      x: 497
      y: 390
    l: 75
    t: 1
    angle: 90.0
    color: "black"

  # Pressure sensor
  - type: "value"
    source: "pressure.value.to_mm_hg"
    format: "%.0f"
    position:
      x: 497
      y: 391
    size:
      w: 146
      h: 50
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"
    label:
      template: "Давление"
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"
    unit:
      parameter: "mmhg"      # Maps to mmHg unit label
      font:
        face: "units"
        fg: "black"
      align:
        p: "bottom"
        s: 8

  # Vertical micro-separator between Pressure and Dew Point
  - type: "line"
    position:
      x: 643
      y: 390
    l: 75
    t: 1
    angle: 90.0
    color: "black"

  # Dew point sensor
  - type: "value"
    source: "dew_point.value"
    format: "%+.1f"
    position:
      x: 643
      y: 391
    size:
      w: 146
      h: 50
    value:
      font:
        face: "values"
        fg: "black"
      align:
        v: "bottom"
    label:
      template: "Точка росы"
      font:
        face: "labels"
        fg: "black"
      align:
        v: "top"
    unit:
      parameter: "celsius"   # Maps to °C
      font:
        face: "units"
        fg: "black"
      align:
        p: "bottom"
        s: 8
