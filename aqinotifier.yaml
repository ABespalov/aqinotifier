# System settings.
system:
  # Maximum number of measurements to keep in RAM for one device (by ID).
  values_in_ram: 10
  # Interval in seconds to check for configuration file changes (0 to disable).
  config_reload_time: 5
  # Interval in seconds to check database connection health.
  health_check_time: 10

# Server settings used to launch the Service. The service is expected to
# accept POST requests on `server.url` (for example POST /aqi).
server:
  # Address to bind the HTTPS server to. Use 0.0.0.0 to accept external requests.
  host: "0.0.0.0"
  # TCP port to listen on
  port: 28288
  # URL path where sensors will POST data
  url: "/aqi"
  # Protocol: "http" or "https"
  protocol: "https"
  # Paths to SSL/TLS certificate and key files. Required if protocol is "https",
  # otherwise these parameters are ignored.
  file:
    cert: "localhost.pem"
    key: "localhost-key.pem"
  # Timeouts are in seconds. Tune according to expected request sizes and
  # network conditions.
  timeout:
    server: 30   # overall server timeout (informational)
    read: 15     # read timeout for incoming requests
    write: 15    # write timeout for responses
    idle: 5      # idle timeout for keep-alive connections
    shutdown: 5  # graceful shutdown timeout

# Database settings used for storing received sensor data.
database:
  # Supported persistence modes: "postgres" (or other SQL provider), "json".
  # You can specify multiple values.
  # - If only "json" is specified, the application uses a JSON file for persistence.
  # - If only a database provider (e.g. "postgres") is specified, only the SQL database is used.
  # - If both are specified, the application uses SQL as primary storage, and falls back
  #   to JSON if the SQL database is unavailable, synchronizing and clearing JSON once connection is restored.
  use:
    - postgres
    - json
  # JSON file settings (always used for persistence and stability).
  # {app} will be replaced with the executable name.
  # If no directory is specified, the executable's directory is used.
  file:
    json: "{app}.data.json"
    # PostgreSQL sub-config file (for database provider)
    # If specified and exists, settings will be loaded from this file.
    pgsql: "{app}.pgsql"
  # Maximum number of values to keep in the JSON file per device ID (only enforced if only "json" is used).
  # Use 0 for no limit.
  max_values: 1500

  # host: "[IP_ADDRESS]"
  # port: 5432
  # db: "postgres"
  # user: "aqinotifier"
  # password: "[PASSWORD]"
  # sslmode: "enable"
  # max_open_conns: 25
  # max_idle_conns: 5
  # conn_max_lifetime: 300
  # Settings for database connections
  connections:
    # Number of connection retry attempts on startup
    retry: 3
    # Delay in seconds between connection retries
    delay: 2

# Local logging configuration (using zerolog).
# - If 'log_file' is empty, file logging is disabled and logs should go to stdout.
# - 'format' can be 'json' (recommended for production) or 'console' (human).
log:
  # log level: debug, info, warn, error, fatal
  level: "debug"
  # File to write logs to. Relative paths are resolved from the working dir.
  # Example: "logs/aqinotifier.log". Leave empty to disable file logging.
  log_file: "{app}.log"
  # Note: Console output is always human-readable (ConsoleWriter),
  # while file output is always JSON for structured analysis.
  format: "json"
  # Rotation settings (used by file-rotation helper such as lumberjack).
  rotate:
    enabled: false
    # Maximum log file size in megabytes before rotation
    max_size_mb: 20
    # Maximum number of rotated files to keep
    max_backups: 1
    # Maximum age in days to keep a rotated file
    max_age_days: 30
    # Compress rotated files to save disk space
    compress: true

# Monitoring and notification settings.
monitor:
  # Raw data correction formulas per device type
  corrections:
    ArmAQI:
      pm25: "1.85 * pm25_raw + 4.5"
      pm10: "?(1.9 * pm10_raw) < pm25:pm25:(1.9 * pm10_raw)"

  # Thresholds for PM2.5 and PM10 zones.
  # Green zone: [0, green]
  # Yellow zone: (green, yellow]
  # Red zone: (yellow, infinity)
  # Values must satisfy: yellow >= green
  pm25:
    level1: 9.0
    level2: 35.4
    diff: 50.0
    lazy_notify:
      up: 2
      down: 3
  
  pm10:
    level1: 54.0
    level2: 154.0
    diff: 66.0
    lazy_notify:
      up: 2
      down: 3

  # Air Quality Index (AQI) calculation standard: "EU" (default) or "US".
  aqi:
    standard: "US"
    lazy_notify:
      up: 2
      down: 3

  # Enabled notifications.
  # AQI zone notifications (based on selected aqi_standard):
  # - aqi: level1, level2, ... (Good, Moderate, etc.)
  #
  # Absolute transitions are grouped by boundary levels and transition direction:
  # - val25 (PM2.5), val10 (PM10), vals (Both PM2.5 and PM10)
  # - boundary levels and transition direction can be:
  #   - level2 (boundary between Level 1/Green and Level 2/Yellow):
  #     - up: rising transition (Level 1 -> Level 2)
  #     - down: falling transition (Level 2 -> Level 1)
  #   - level3 (boundary between Level 2/Yellow and Level 3/Red):
  #     - up: rising transition (Level 2 -> Level 3)
  #     - down: falling transition (Level 3 -> Level 2)
  # For example:
  #   val25:
  #     - level2:
  #       - up
  #       - down
  #     - level3:
  #       - up
  #
  # Relative changes are grouped similarly:
  # - diff25 (PM2.5), diff10 (PM10), diffs (Both PM2.5 and PM10)
  # For example:
  #   diff25:
  #     - level1:
  #       - up: Growth while staying in Level 1
  #       - down: Drop resulting in Level 1
  #     - level2:
  #       - up: Growth resulting in Level 2
  #       - down: Drop resulting in Level 2
  #     - level3:
  #       - up: Growth resulting in Level 3
  #       - down: Drop while staying in Level 3
  notifications:
    aqi:
      - level1
      - level2
      - level3
      - level4
      - level5
      - level6
      - level7

  # List of notifications that should be sent WITH sound by default.
  # Others will be silent unless changed by the user in the bot settings.
  warnings:
    aqi:
      - level1
      - level2
      - level3
      - level4
      - level5
      - level6
      - level7
    val25:
      - level2:
        - up
        - down
      - level3:
        - up
    val10:
      - level2:
        - up
        - down
      - level3:
        - up
    vals:
      - level2:
        - up
        - down
      - level3:
        - up

# Optional: metrics / observability settings could be added here later.

# Telegram bot settings.
# To activate: set enabled to true and provide a valid bot token from @BotFather.
tgbot:
  # Set to true to start the Telegram bot alongside the HTTP server.
  enabled: true
  # Bot token issued by @BotFather. Keep this secret!
  # token: "0000000000:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  file:
    # File to read the token from if 'token' is not provided.
    token: "{app}.tgbot.token"
    # JSON file to persist user subscriptions.
    # {app} is replaced with the executable name. If no directory is specified,
    # the file is placed next to the executable.
    json: "{app}.tgbot.json"
  # Enable verbose Telegram API debug output (prints all API calls to stdout).
  debug: false
  chart:
    # Chart width in pixels
    width: 1024
    # Chart height in pixels
    height: 768
    # Chart font size
    font_size: 12.0
  default:
    unit:
      # Default units for measurements (Temperature: c/f, Pressure: mmhg/hpa)
      temp: "c"
      press: "mmhg"
